<!DOCTYPE html>
<html>
  <head>
    <title>WebGL info test</title>
    <meta charset="utf-8">
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        background: #f6f8fa;
        color: #1f2328;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 1.8rem;
      }

      canvas {
        display: none;
      }

      section {
        margin: 18px 0;
        padding: 18px;
        background: #fff;
        border: 1px solid #d0d7de;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(31, 35, 40, 0.06);
      }

      section > p:first-child {
        margin: 0 0 10px;
        color: #57606a;
      }

      .count {
        color: #57606a;
        font-size: 0.9rem;
        font-weight: 400;
      }

      .result {
        margin: 0;
        padding: 12px;
        background: #f6f8fa;
        border-radius: 6px;
        color: #24292f;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.9rem;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .extension-list {
        display: grid;
        gap: 8px;
        white-space: normal;
      }

      details {
        padding: 10px 12px;
        background: #f6f8fa;
        border-radius: 6px;
      }

      summary {
        cursor: pointer;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 0.9rem;
        font-weight: 600;
      }

      pre {
        margin: 10px 0 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WebGL Info Test</h1>
      <canvas id="test" width="8" height="8"></canvas>

      <section>
        <p><b>gl.getSupportedExtensions()</b> <span class="count" id="supported-extensions-count">(loading...)</span></p>
        <p class="result" id="supported-extensions">loading...</p>
      </section>

      <section>
        <p><b>gl.getExtension(name) object for each supported extension</b></p>
        <div class="result extension-list" id="available-extensions">loading...</div>
      </section>

      <section>
        <p><b>gl.getParameter(WEBGL_debug_renderer_info)</b></p>
        <p class="result" id="renderer-info">loading...</p>
      </section>

      <section>
        <p><b>gl.getParameter(gl.VENDOR) and gl.getParameter(gl.RENDERER)</b></p>
        <p class="result" id="standard-renderer-info">loading...</p>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("test");
      const gl = canvas.getContext("webgl");

      const supportedExtensionsElement = document.getElementById("supported-extensions");
      const supportedExtensionsCountElement = document.getElementById("supported-extensions-count");
      const availableExtensionsElement = document.getElementById("available-extensions");
      const rendererInfoElement = document.getElementById("renderer-info");
      const standardRendererInfoElement = document.getElementById("standard-renderer-info");

      const formatExtensionObject = (extension) => {
        if (!extension) {
          return "null";
        }

        const extensionType = Object.prototype.toString.call(extension);
        const ownProperties = Object.getOwnPropertyNames(extension);
        const prototypeProperties = Object.getOwnPropertyNames(Object.getPrototypeOf(extension) || {})
          .filter((property) => property !== "constructor");
        const properties = [...new Set([...ownProperties, ...prototypeProperties])];

        if (!properties.length) {
          return extensionType;
        }

        const details = properties.map((property) => {
          const value = extension[property];
          return property + ": " + String(value);
        });
        return extensionType + " { " + details.join(", ") + " }";
      };

      if (!gl) {
        supportedExtensionsCountElement.textContent = "(0 found)";
        supportedExtensionsElement.textContent = "no-webgl";
        availableExtensionsElement.textContent = "no-webgl";
        rendererInfoElement.textContent = "no-webgl";
        standardRendererInfoElement.textContent = "no-webgl";
      } else {
        const supportedExtensions = gl.getSupportedExtensions() || [];
        supportedExtensionsCountElement.textContent = "(" + supportedExtensions.length + " found)";
        supportedExtensionsElement.textContent = supportedExtensions.join(", ");

        availableExtensionsElement.textContent = "";
        for (const name of supportedExtensions) {
          const extension = gl.getExtension(name);

          const detailsElement = document.createElement("details");
          const summaryElement = document.createElement("summary");
          const objectElement = document.createElement("pre");

          summaryElement.textContent = name;
          objectElement.textContent = formatExtensionObject(extension);

          detailsElement.append(summaryElement, objectElement);
          availableExtensionsElement.append(detailsElement);
        }

        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        if (debugInfo) {
          const vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
          const renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          rendererInfoElement.textContent = "Vendor: " + vendor + "\nRenderer: " + renderer;
        } else {
          rendererInfoElement.textContent = "no-debug-renderer-info";
        }

        const standardVendor = gl.getParameter(gl.VENDOR);
        const standardRenderer = gl.getParameter(gl.RENDERER);
        standardRendererInfoElement.textContent = "Vendor: " + standardVendor + "\nRenderer: " + standardRenderer;
      }
    </script>
  </body>
</html>
